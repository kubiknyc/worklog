# Internal preview builds on every merge to main that touches shipping code.
#
# `fingerprint` runs first so the build matches the runtimeVersion policy in
# app.json ({"policy": "fingerprint"}) — a native-module change produces a new
# runtime version, which is what stops an OTA update landing on a binary that
# lacks the native code it needs.
#
# Production builds and store submission are deliberately NOT here. Promotion
# to `production` is a manual decision, and the offline-first rule stands:
# never OTA a SQLite schema or mutation-payload shape change — a device that
# has been offline for days has queued mutations written in the old shape.
name: release

on:
  push:
    branches: ['main']
    paths:
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'

jobs:
  fingerprint:
    type: fingerprint

  build_android:
    needs: [fingerprint]
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    needs: [fingerprint]
    type: build
    params:
      platform: ios
      profile: preview
