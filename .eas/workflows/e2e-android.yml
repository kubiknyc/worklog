# Android E2E on every PR. Builds an emulator-compatible APK from the
# `e2e-test` profile (demo logins ON — .maestro/login.yaml depends on them)
# and runs the Maestro flows against it.
#
# The `maestro` job type is alpha. Keep this OUT of required status checks
# until it has proven stable, so an infra flake can't block a merge.
name: e2e-android

on:
  pull_request:
    branches: ['*']

jobs:
  build_android_for_e2e:
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_test:
    needs: [build_android_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_android_for_e2e.outputs.build_id }}
      flow_path:
        - .maestro/login.yaml
        # report-sections was written but never listed here, so it had never
        # run in CI. It is listed after login because it starts from a signed-in
        # session, which the e2e-test profile's demo logins provide (#21).
        - .maestro/report-sections.yaml
        # offline-reconcile is LAST, deliberately. Maestro has no `finally`:
        # if it fails between setAirplaneMode enabled/disabled, the device
        # stays offline and every later flow in the same session fails at
        # sign-in with a misleading network error. Last confines that blast
        # radius to itself.
        #
        # Risk: setAirplaneMode drives `adb shell`, which may be a no-op on
        # an EAS cloud maestro runner. If so this fails loudly (the terminal
        # sync-status-offline wait times out) rather than silently passing —
        # that is the correct failure, and the `maestro` job is already kept
        # out of required status checks, so it cannot block a merge.
        - .maestro/offline-reconcile.yaml
        # lifecycle-lock.yaml is intentionally NOT listed: locking is
        # irreversible and UNIQUE(project_id, report_date) means one report
        # per project per day, so a run on this shared backend would lock
        # today's report for every subsequent PR run the same day. Local
        # pre-merge ritual only (.maestro/lifecycle-lock.yaml header) until
        # there is a per-run ephemeral backend or a project-switcher testID.
