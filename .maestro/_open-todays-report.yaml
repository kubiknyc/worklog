# Shared: from Today, create-or-open today's report, landing on screen-report.
#
# Extracted because it was duplicated verbatim across report-sections.yaml,
# offline-reconcile.yaml, and lifecycle-lock.yaml (flagged by code review —
# the launch+sign-in extraction in an earlier commit killed one duplication
# but left this second identical block to be copy-pasted twice more).
#
# Leading underscore, flat in .maestro/, not a subdirectory: same reasoning
# as _launch-and-signin.yaml — the selector guard's readdirSync is
# non-recursive, and running this alone (after signing in) is harmless.
#
# Consumed via:  - runFlow: _open-todays-report.yaml
appId: com.jobsight.worklog
---
# The buttons render only once the initial tier-1 pull lands memberships and
# the active-project bridge resolves — on a fresh install that is seconds
# after Today mounts, so give it a bounded wait before the instantaneous
# when-visible checks below (observed race: checks ran ~7s before the first
# pull committed). optional: on re-runs a report already exists, so
# start-report may never appear and open-report is the one that renders.
- extendedWaitUntil:
    visible:
      id: 'today-start-report'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'today-start-report'
    commands:
      - tapOn:
          id: 'today-start-report'
- runFlow:
    when:
      visible:
        id: 'today-open-report'
    commands:
      - tapOn:
          id: 'today-open-report'
- extendedWaitUntil:
    visible:
      id: 'screen-report'
    timeout: 10000
