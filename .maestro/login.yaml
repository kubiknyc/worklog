# Auth smoke test — the one end-to-end path that is fully built as of M2.
#
# Covers: cold launch -> AuthSplash while the session restores -> login screen
# -> real Supabase email/password sign-in -> layout guard redirects into tabs.
#
# Selectors are testIDs, not visible copy. User-facing copy in this app is
# plain language and expected to change (CLAUDE.md), so asserting on it makes
# a flow break for a reason that has nothing to do with the flow.
#
# PRECONDITIONS
#   1. A build with demo logins enabled. The demo-account rows are gated on
#      `__DEV__` and on EXPO_PUBLIC_DEMO_LOGINS != 'off' (app/(auth)/login.tsx).
#      Use the `e2e-test` or `development` EAS profile:
#        eas build --profile e2e-test --platform android
#      A `preview` or `production` build has no demo rows and the fast path
#      below will not appear.
#   2. The local Supabase stack running in ../jobsight-backend
#      (`supabase start`), seeded with the demo accounts from seed.sql.
#      Sign-in is a real network call — with no backend it fails.
#
# Run:  maestro test .maestro/login.yaml
appId: com.jobsight.worklog
---
- launchApp:
    clearState: true

# Login screen is up once its fields exist.
- assertVisible:
    id: 'login-email'
- assertVisible:
    id: 'login-password'
- assertVisible:
    id: 'login-submit'

# Fast path: tap the seeded Superintendent demo row, which fills both fields
# and submits in one action (onDemoPress).
- tapOn:
    id: 'login-demo-superintendent'

# The layout guard redirects on success; login.tsx never navigates manually.
# Generous timeout: this is a real GoTrue round-trip, not a mock.
- extendedWaitUntil:
    visible:
      id: 'screen-today'
    timeout: 20000

# Tab bar is present and navigable.
- assertVisible:
    id: 'tab-history'
- assertVisible:
    id: 'tab-photos'
- assertVisible:
    id: 'tab-settings'

# Navigation actually moves between screens (not just a rendered tab bar).
- tapOn:
    id: 'tab-history'
- assertVisible:
    id: 'screen-history'
- tapOn:
    id: 'tab-today'
- assertVisible:
    id: 'screen-today'
