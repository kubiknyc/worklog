# Report section sheets — drives every M2 editor sheet end-to-end.
#
# Covers: login -> Today -> create/open today's report -> open each section
# sheet, exercise the interactions that are reachable by testID (add an entry
# on list sheets, affirm "nothing to report" on Safety), close via Done ->
# back to Today.
#
# Selectors are testIDs only (see .maestro/README.md). Interactions that would
# need copy or a11y-label taps (chip picks, steppers, switches, text entry)
# are covered by Jest component tests, not here — this flow proves navigation
# reaches every sheet and the testID surface is real on-device.
#
# Idempotent by design: re-runs may find today's report already created (the
# backend persists across clearState), so the Today tap is conditional, and
# no step asserts entry counts.
#
# PRECONDITIONS: same as login.yaml (e2e-test build with demo logins, local
# Supabase stack from ../jobsight-backend seeded with demo accounts).
#
# Run:  maestro test .maestro/report-sections.yaml
appId: com.jobsight.worklog
---
- launchApp:
    clearState: true

# Dev-client builds (expo run:android) land on the expo-dev-client launcher
# after clearState wipes its remembered server. Third-party UI — no testIDs
# exist, so these steps key on the URL text. Release e2e builds never show
# the launcher and skip this.
# The launcher renders a beat after launchApp returns, so give it a bounded
# optional wait first — otherwise the when-visible check below races it and
# skips the handling entirely (observed on Maestro 2.7.0). optional: a release
# build never shows the launcher, and that must not fail the flow.
- extendedWaitUntil:
    visible: '.*:8081.*'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: '.*:8081.*'
    commands:
      # Deep-link straight to Metro over the adb-reverse tunnel instead of
      # tapping the launcher's auto-detected 10.0.2.2 row: the emulator-NAT
      # route to the host can be firewall-blocked ("Error loading app:
      # timeout") while 127.0.0.1 via `adb reverse tcp:8081` always works.
      - openLink: 'worklog://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
      # The first-run developer-menu sheet may overlay the app once the
      # bundle renders (clearState resets it). Wait for it — bundle load can
      # take tens of seconds on a cold Metro — then dismiss. Conditional:
      # a prewarmed Metro sometimes renders the app with no sheet at all.
      - extendedWaitUntil:
          visible: 'Continue'
          timeout: 120000
          optional: true
      # 'Continue' advances into the full developer menu; Android back
      # closes it and reveals the app.
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn: 'Continue'
            - back

# --- Sign in via the seeded demo row (same fast path as login.yaml). ---
# extendedWaitUntil (not assertVisible): the first bundle request after a
# fresh install compiles for tens of seconds on a dev build.
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 90000
- tapOn:
    id: 'login-demo-superintendent'
- extendedWaitUntil:
    visible:
      id: 'screen-today'
    timeout: 20000

# Queue is provably empty here (clearState wiped SQLite; login and the
# reference-mirror seed enqueue nothing) → the pill reads synced. Near-vacuous
# alone (idle state derives to synced even if the counter never installed) —
# its signal is as the before-half of the synced→queued pair below.
- assertVisible:
    id: 'sync-status-synced'

# --- Enter today's report: create it, or open the existing one. ---
# The buttons render only once the initial tier-1 pull lands memberships and
# the active-project bridge resolves — on a fresh install that is seconds
# after Today mounts, so give it a bounded wait before the instantaneous
# when-visible checks below (observed race: checks ran ~7s before the first
# pull committed). optional: on re-runs a report already exists, so
# start-report may never appear and open-report is the one that renders.
- extendedWaitUntil:
    visible:
      id: 'today-start-report'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'today-start-report'
    commands:
      - tapOn:
          id: 'today-start-report'
- runFlow:
    when:
      visible:
        id: 'today-open-report'
    commands:
      - tapOn:
          id: 'today-open-report'
- extendedWaitUntil:
    visible:
      id: 'screen-report'
    timeout: 10000

# --- Weather: auto snapshot + manual override sheet opens and closes. ---
- tapOn:
    id: 'report-section-weather'
- assertVisible:
    id: 'sheet-weather-done'
- tapOn:
    id: 'sheet-weather-done'
- assertVisible:
    id: 'screen-report'

# --- Crew & work: combined sheet opens; empty state shows the affirmation. ---
- tapOn:
    id: 'report-section-crew_work'
- assertVisible:
    id: 'sheet-crew-work-done'
- tapOn:
    id: 'sheet-crew-work-done'
- assertVisible:
    id: 'screen-report'

# --- Deliveries: add an entry (writes through the autosave path), close. ---
- tapOn:
    id: 'report-section-deliveries'
- assertVisible:
    id: 'sheet-deliveries-done'
# Re-runs accumulate one entry per run (the backend persists across
# clearState), so the Add row drifts below the fold — scroll it into view
# before tapping. Applies to every list sheet below for the same reason.
- scrollUntilVisible:
    element:
      id: 'sheet-deliveries-add'
- tapOn:
    id: 'sheet-deliveries-add'
- tapOn:
    id: 'sheet-deliveries-done'
- assertVisible:
    id: 'screen-report'
# The deliveries add wrote through the autosave path (closing the sheet
# flushes the draft debounce), and the sync engine (M3) now drains the queue
# on its own cadence. queued is a transient, not a resting state, and against
# a local Supabase stack the drain is fast enough that even a short
# extendedWaitUntil here races the engine and flakes both ways (caught
# mid-transition or missed entirely) — dropped per the M3a plan's own
# fallback. The terminal sync-status-synced assert below (after Back to
# Today) is the real proof: it can only pass if this write enqueued AND
# drained, so it still exercises the create_report → sections → drain path
# this section covers.

# --- Equipment: add is gated on a typed name, so open/close only. ---
- tapOn:
    id: 'report-section-equipment'
- assertVisible:
    id: 'sheet-equipment-done'
- tapOn:
    id: 'sheet-equipment-done'
- assertVisible:
    id: 'screen-report'

# --- Inspections: add an entry, close. ---
- tapOn:
    id: 'report-section-inspections'
- assertVisible:
    id: 'sheet-inspections-done'
- scrollUntilVisible:
    element:
      id: 'sheet-inspections-add'
- tapOn:
    id: 'sheet-inspections-add'
- tapOn:
    id: 'sheet-inspections-done'
- assertVisible:
    id: 'screen-report'

# --- Safety: affirm "nothing to report" via the derived -none row. ---
# The affirmation writes is_complete=true and closes the sheet itself.
- scrollUntilVisible:
    element:
      id: 'report-section-safety'
- tapOn:
    id: 'report-section-safety'
- assertVisible:
    id: 'sheet-safety-done'
- tapOn:
    id: 'sheet-safety-none'
- assertVisible:
    id: 'screen-report'

# --- Delays: add an entry, close. ---
- scrollUntilVisible:
    element:
      id: 'report-section-delays'
- tapOn:
    id: 'report-section-delays'
- assertVisible:
    id: 'sheet-delays-done'
- scrollUntilVisible:
    element:
      id: 'sheet-delays-add'
- tapOn:
    id: 'sheet-delays-add'
- tapOn:
    id: 'sheet-delays-done'
- assertVisible:
    id: 'screen-report'

# --- Visitors: add an entry, close. ---
- scrollUntilVisible:
    element:
      id: 'report-section-visitors'
- tapOn:
    id: 'report-section-visitors'
- assertVisible:
    id: 'sheet-visitors-done'
- scrollUntilVisible:
    element:
      id: 'sheet-visitors-add'
- tapOn:
    id: 'sheet-visitors-add'
- tapOn:
    id: 'sheet-visitors-done'
- assertVisible:
    id: 'screen-report'

# --- RFIs: add an entry, close. ---
- scrollUntilVisible:
    element:
      id: 'report-section-rfis'
- tapOn:
    id: 'report-section-rfis'
- assertVisible:
    id: 'sheet-rfis-done'
- scrollUntilVisible:
    element:
      id: 'sheet-rfis-add'
- tapOn:
    id: 'sheet-rfis-add'
- tapOn:
    id: 'sheet-rfis-done'
- assertVisible:
    id: 'screen-report'

# --- General notes: pre-existing Notes sheet still opens and closes. ---
- scrollUntilVisible:
    element:
      id: 'report-section-general_notes'
- tapOn:
    id: 'report-section-general_notes'
- assertVisible:
    id: 'sheet-notes-done'
- tapOn:
    id: 'sheet-notes-done'
- assertVisible:
    id: 'screen-report'

# --- Back out to Today. ---
- tapOn:
    id: 'report-back'
- assertVisible:
    id: 'screen-today'
# Cross-screen: Today's pill reads the same hub, proving the subscription
# spans screens. The sync engine (M3) drains the queue it accumulated above,
# so the resting state here is synced, not queued — the stronger claim the
# engine now makes true. A transient sync-status-syncing frame is expected
# and tolerated (drain isn't instant); only the terminal state is asserted,
# with a generous wait since the drain runs on its own network round trip.
- extendedWaitUntil:
    visible:
      id: 'sync-status-synced'
    timeout: 30000
